<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>笃行班 · 断网应急版</title><style>
:root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#244638;background:#f8f7f1}*{box-sizing:border-box}body{margin:0}header,main,footer{width:min(1080px,90%);margin:auto}header{padding:25px 0;border-bottom:1px solid #dce2d3;display:flex;justify-content:space-between;font-size:13px}header span{color:#b17742}main{padding:50px 0}h1{font-size:44px;line-height:1.4;margin:15px 0}p{line-height:1.9;color:#7c8972}.tag{font-size:11px;letter-spacing:2px;color:#829572}.panel{padding:30px;background:#edf1e2;border:1px solid #dbe4d0;border-radius:16px;margin:25px 0}h2{font-size:25px}textarea,input{font:inherit;width:100%;border:1px solid #d6dfcb;border-radius:9px;padding:13px;background:#fffefa;color:#244638}textarea{min-height:130px;line-height:1.8}label{display:block;font-size:14px;margin:15px 0}label input{width:85px;margin-left:20px}button{border:1px solid #cfd9c3;background:#fffefa;color:#244638;padding:12px 20px;border-radius:9px;font:inherit;font-size:13px;cursor:pointer;margin:5px}.primary{background:#205d49;color:white;border-color:#205d49}nav{display:flex;gap:10px;flex-wrap:wrap}small{font-size:12px;color:#929c86}.report-row{padding:20px 0;border-bottom:1px solid #dce4d1;white-space:pre-wrap}.report-row p{color:#65785d}footer{padding:25px 0;border-top:1px solid #dce2d3;font-size:11px;color:#929c86}.report-note{background:#fff0d7;color:#986b32;padding:15px;border-radius:9px;font-size:12px}.subtle{font-size:12px} @media(max-width:600px){h1{font-size:29px}.panel{padding:23px}main{padding-top:30px}}@media print{nav,button,footer{display:none}main{padding:0}h1{font-size:30px}.panel{background:white;border:0;padding:0}}
</style></head><body><header><strong>笃行班 / CLASS QUEST 02</strong><span>本地应急 · 现场录入</span></header><main><span class="tag" id="tag"></span><h1 id="title"></h1><p id="subtitle"></p><section class="panel" id="panel"></section><nav><button id="prev">上一步</button><button class="primary" id="next">保存并继续</button><button id="report">生成现场报告</button><button id="backup">导出本地备份</button><button id="print">打印／保存PDF</button></nav><p class="subtle">全部操作由主持人手动决定，无自动跳转。本页不接收手机提交，也不会与云端结果混合。请用举手、口头分享等方式参与，再录入实际结果。</p></main><footer>文件可以保存在电脑上，断网后直接用浏览器打开。请勿在正式班会中填入示例人数。</footer><script>
const steps=[
 {title:'网络暂时离线，我们继续同行。',sub:'这一关，换一种方式一起过。',cue:'告诉同学改用举手和口头分享。已经在云端保存的内容仍保留；本页只记录切换后的现场内容。',type:'start'},
 {title:'留一条队友用得上的情报',sub:'东校区生活攻略，或百歌的一段记忆。',cue:'邀请两三位同学自愿分享。下方每行录入一条实际回答，可不记录姓名。',type:'text'},
 {title:'大二的你，更新了什么？',sub:'相比大一，我新增了____，也开始需要____。',cue:'邀请自愿分享，记录真实原话或经本人同意的简要表达。',type:'text'},
 {title:'今晚只剩4格时间',sub:'课程任务、课外机会、休息生活，你会怎样分配？',cue:'请三位同学各自说明4枚时间币的分配，再录入合计；也可自行统计全班实际分配。',type:'count',labels:['课程任务（枚）','课外机会（枚）','休息生活（枚）']},
 {title:'队友发来了一条消息',sub:'“我这两天状态不太好，可能赶不上原计划。”',cue:'请大家举手选择，记录实际票数。',type:'count',labels:['我先补上关键部分','先了解情况，再调整分工','一起缩小范围，保证核心质量']},
 {title:'联机之后，我们能多做什么？',sub:'如果班级能提供一种帮助，我希望是____。',cue:'邀请同学说出具体期待，或者按学习搭子、经验分享、运动陪伴、生活攻略举手表达。',type:'text'},
 {title:'下一件小事，一起决定',sub:'本学期，我们先认真推进哪件事？每人一票。',cue:'逐项举手投票，记录真实票数。并列时保留共同候选。',type:'count',labels:['学习互助小组','大二经验交流','班级运动或散步','东校区生活攻略']},
 {title:'大二副本已开启，笃行班仍在联机。',sub:'现场参与报告 · 以下内容由主持人录入。',type:'report'}];
let saved;try{saved=JSON.parse(localStorage.getItem('duxing-offline')||'{}')}catch{saved={}}let stage=Number(saved.stage)||0;const records=saved.records||{};const $=x=>document.getElementById(x);const escape=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){try{localStorage.setItem('duxing-offline',JSON.stringify({stage,records}))}catch{}}
function capture(){const step=steps[stage];if(step.type==='text')records[stage]=$('answer').value.trim();if(step.type==='count')records[stage]=step.labels.map((_,i)=>Number($('count'+i).value)||0);persist()}
function render(){const s=steps[stage];$('tag').textContent=stage===7?'OUR CLASS REPORT':'笃行班 · 应急任务 '+stage;$('title').textContent=s.title;$('subtitle').textContent=s.sub;$('prev').disabled=stage===0;$('next').style.display=stage===7?'none':'';
 if(s.type==='start')$('panel').innerHTML='<h2>同一班级，同一个故事。</h2><p>'+escape(s.cue)+'</p><p>每一步都由你点击推进，时间仅作参考。</p>';
 if(s.type==='text')$('panel').innerHTML='<p>'+escape(s.cue)+'</p><textarea id="answer" placeholder="录入实际分享，每行一条">'+escape(records[stage]||'')+'</textarea>';
 if(s.type==='count')$('panel').innerHTML='<p>'+escape(s.cue)+'</p>'+s.labels.map((l,i)=>'<label>'+escape(l)+'<input id="count'+i+'" type="number" min="0" max="320" value="'+Number(records[stage]?.[i]||0)+'"></label>').join('');
 if(s.type==='report'){let html='<div class="report-note">这是现场录入报告，不是云端手机答题统计。未录入的关卡保留为暂无数据。</div>';for(let i=1;i<=6;i++){const r=records[i];html+='<section class="report-row"><h2>'+escape(steps[i].title)+'</h2>';if(Array.isArray(r)){html+='<p>'+r.map((n,j)=>escape(steps[i].labels[j])+': '+n).join('\n')+'</p>';if(i===3){const m=Math.max(...r);html+='<p>'+(!m?'本轮暂未形成结论。':r.filter(x=>x===m).length>1?'多线并行：大家的选择各不相同，接下来需要协调。':['稳步推进：展示有了底气，但待办清单还没清空。','主动探索：你发现了新机会，原有任务也需要重新安排。','恢复续航：状态正在恢复，下一步要确定从哪件事开始。'][r.indexOf(m)])+'</p>'}if(i===6){const m=Math.max(...r);html+='<p>共同候选：'+(m?r.flatMap((n,j)=>n===m?[escape(steps[i].labels[j])]:[]).join(' / '):'暂无数据')+'。班委会后确认安排并反馈。</p>'}}else html+='<p>'+escape(r||'本轮暂无录入。')+'</p>';html+='</section>'}html+='<p>期待老师结合这些真实的声音，给予笃行班建议与寄语。</p>';$('panel').innerHTML=html}persist();window.scrollTo(0,0)}
$('next').onclick=()=>{capture();stage=Math.min(7,stage+1);render()};$('prev').onclick=()=>{capture();stage=Math.max(0,stage-1);render()};$('report').onclick=()=>{capture();stage=7;render()};$('backup').onclick=()=>{capture();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({source:'现场录入',exportedAt:new Date().toISOString(),records},null,2)],{type:'application/json'}));a.download='笃行班-现场应急记录.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)};$('print').onclick=()=>window.print();render();
</script></body></html>
